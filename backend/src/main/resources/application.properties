spring.application.name=sleep-tracker

# PostgreSQL by default; override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/sleeptracker
spring.datasource.username=sleeptracker
spring.datasource.password=sleeptracker
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/openapi
management.endpoints.web.exposure.include=health

sleeptracker.max-nights-per-workspace=1000
