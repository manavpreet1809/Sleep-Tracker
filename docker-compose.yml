# Run the whole app locally: docker compose up --build, then open http://localhost:8080
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sleeptracker
      POSTGRES_USER: sleeptracker
      POSTGRES_PASSWORD: sleeptracker
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleeptracker -d sleeptracker"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sleeptracker
      SPRING_DATASOURCE_USERNAME: sleeptracker
      SPRING_DATASOURCE_PASSWORD: sleeptracker
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
